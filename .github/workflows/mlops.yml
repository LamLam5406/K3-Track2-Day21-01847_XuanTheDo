name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
      CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        if: env.CLOUD_BUCKET != '' && env.CLOUD_CREDENTIALS != ''
        run: |
          printf '%s' "$CLOUD_CREDENTIALS" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> "$GITHUB_ENV"

      - name: Pull data from GCS with DVC
        if: env.CLOUD_BUCKET != '' && env.CLOUD_CREDENTIALS != ''
        run: |
          dvc remote add --force --default myremote "gs://$CLOUD_BUCKET/dvc"
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Pull data from bundled DVC remote (offline fallback)
        if: env.CLOUD_BUCKET == '' || env.CLOUD_CREDENTIALS == ''
        run: |
          dvc remote modify localremote url "$GITHUB_WORKSPACE/.dvc-storage"
          dvc pull --remote localremote data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"

      - name: Upload model to Cloud Storage
        if: env.CLOUD_BUCKET != '' && env.CLOUD_CREDENTIALS != ''
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ["CLOUD_BUCKET"])
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Uploaded model to gs://{bucket.name}/{blob.name}")
          EOF

      - name: Save model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        env:
          MODEL_ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'EOF'
          import os

          acc = float(os.environ["MODEL_ACCURACY"])
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.70. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:

      - name: SSH deploy to VM
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ env.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for attempt in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for service (attempt $attempt/6)..."
              sleep 5
            done
            echo "Health check failed."
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1

      - name: Checkout for local deployment fallback
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        uses: actions/checkout@v4

      - name: Set up Python for local deployment fallback
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install serving dependencies
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        run: pip install -r requirements.txt

      - name: Download trained model
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models

      - name: Deploy and smoke-test API on runner (offline fallback)
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        env:
          MODEL_PATH: ${{ github.workspace }}/models/model.pkl
        run: |
          uvicorn src.serve:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1:8000/health; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              cat /tmp/uvicorn.log
              exit 1
            fi
            sleep 5
          done

          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[7.4,0.70,0.00,1.9,0.076,11.0,34.0,0.9978,3.51,0.56,9.4,0]}'
